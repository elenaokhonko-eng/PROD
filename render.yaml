services:
  - type: web
    name: guidebuoy-nextjs
    runtime: node
    plan: standard
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_SELF_SERVE_REPORT_SGD
        sync: false
      - key: STRIPE_PRICE_ID_FIDREC_TIER2_PACK_SGD
        sync: false
      - key: STRIPE_PRICE_ID_HUMAN_CONSULT_30M_SGD
        sync: false
      - key: SIMULATION_KEY
        sync: false
      - key: WORKER_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: LOG_LEVEL
        value: info

  - type: worker
    name: guidebuoy-worker
    runtime: node
    plan: standard
    buildCommand: pnpm install
    startCommand: pnpm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SIMULATION_KEY
        sync: false
      - key: WORKER_SECRET
        fromService:
          type: web
          name: guidebuoy-nextjs
          envVarKey: WORKER_SECRET
