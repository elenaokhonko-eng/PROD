name: Harbor release gates

# CI minutes (Elena, 8 Nov): every push to a pull request runs the quick lane (install, typecheck, build, contracts,
# database). The heavy lanes (public UI on Windows, synthetic, and the live staging lanes) run when a pull request is
# opened, reopened, marked ready or labelled full-ci, on main, and by hand (workflow_dispatch) after a staging deploy.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harbor-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  HARBOR_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  frozen-install:
    name: Frozen install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HARBOR_RELEASE_SHA }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  static-gates:
    name: TypeScript, build, and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A local SMTP server for the SMTP delivery check: CI never sends to Mailtrap (Elena, 8 Nov).
    services:
      mailpit:
        image: axllent/mailpit:v1.20.0
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-placeholder
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_build_placeholder
      CLERK_SECRET_KEY: sk_test_build_placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HARBOR_RELEASE_SHA }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: No server secret in the client bundle
        run: pnpm exec tsx scripts/check-client-bundle.mts
      # Addendum S4: no secret in the bundle or public/, no public source maps, and no secret in lines a pull request adds.
      - name: Secret scan (bundle, public folder, new lines)
        run: |
          pnpm exec tsx scripts/scan-secrets.ts bundle public
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
            pnpm exec tsx scripts/scan-secrets.ts diff "origin/${{ github.base_ref }}"
          fi
      - name: State-machine rules
        run: pnpm check:sm
      - name: Release and contract tests
        run: pnpm exec tsx --test tests/contracts/*.test.ts tests/release/*.test.ts
      - name: SMTP delivery (Mailpit)
        run: pnpm exec tsx --test tests/integration/mail-mailpit.test.ts
        env:
          MAILPIT_API_URL: http://127.0.0.1:8025
      - name: Harbor UI contract
        run: pnpm test:harbor-contract
      - name: Edge authorization contract
        run: pnpm test:edge-authorization
      - name: Document readiness
        run: pnpm test:document-readiness
      - name: Validation reconciliation
        run: pnpm test:validation-recon
      - name: Payment and subscription branching
        run: pnpm test:slice8-payments

  migration-rls:
    name: Migration apply, lint, and Pattern C RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HARBOR_SUPABASE_CLI_VERSION: ${{ vars.HARBOR_SUPABASE_CLI_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HARBOR_RELEASE_SHA }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deterministic migration-conflict fixtures
        run: pnpm test:migration-conflicts
      - name: Require pinned Supabase CLI
        run: test -n "$HARBOR_SUPABASE_CLI_VERSION"
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.HARBOR_SUPABASE_CLI_VERSION }}
      - name: Record Supabase CLI version
        run: supabase --version
      # Supabase's local ports (54320-54329) sit inside Linux's temporary port range, so an outgoing connection (the
      # image pulls just before) can briefly hold one and `supabase start` fails to bind it (24 and 25 Nov 2026).
      # Reserving them keeps the kernel from handing them out; nothing else on the runner listens there.
      - name: Reserve the local Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - name: Start clean local Supabase
        run: supabase start
      - name: Apply all migrations from zero
        run: supabase db reset --local
      - name: Lint migrated database
        run: supabase db lint --local --level error
      - name: Two-user Pattern C RLS
        run: supabase test db tests/database/pattern-c-rls.test.sql
      - name: Fact reconciliation tables (history, RLS, immutability)
        run: supabase test db tests/database/fact-reconciliation.test.sql
      - name: Model-call metering (service role only, no text)
        run: supabase test db tests/database/model-usage.test.sql
      - name: Security baseline (RLS, anon writes, views, buckets)
        run: supabase test db tests/database/security-baseline.test.sql
      - name: Browser-selected columns exist
        run: supabase test db tests/database/client-columns.test.sql
      - name: App query columns exist in the migrated schema
        run: pnpm exec tsx scripts/check-supabase-columns.ts
      - name: Fact reconcile runner against the migrated schema
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY)=')"
          LOCAL_SUPABASE_URL="$API_URL" LOCAL_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" pnpm exec tsx scripts/test-facts-reconcile-local.ts

  playwright-public:
    name: Playwright public UI
    runs-on: windows-latest
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' || github.event.action != 'synchronize' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    env:
      # CI-only: Clerk keyless mode must never inject its claim overlay into tests.
      NEXT_PUBLIC_CLERK_KEYLESS_DISABLED: '1'
      # The tests' own server sees every request from one address: per-IP model limits are the spec's in production only.
      USAGE_LIMIT_PRE_SIGN_IN_REQUESTS_PER_IP_PER_HOUR: '100000'
      USAGE_LIMIT_PRE_SIGN_IN_REQUESTS_PER_IP_PER_DAY: '100000'
      USAGE_LIMIT_MODEL_REQUESTS_PER_IP_PER_HOUR: '100000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HARBOR_RELEASE_SHA }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium webkit
      - run: pnpm build
      - name: Production public UI
        env:
          HARBOR_E2E_WEB_SERVER_COMMAND: pnpm start
        # One worker: with Playwright's default of two, the Windows runner ran out of socket buffers
        # (net::ERR_NO_BUFFER_SPACE), failing a page load and skipping the paid journeys (24 Nov 2026, three runs).
        # No retries: a real failure still fails the job.
        run: pnpm exec playwright test --config=playwright.config.ts --workers=1
      - name: Upload public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-public-${{ env.HARBOR_RELEASE_SHA }}
          path: |
            test-results/public/
            test-results/evidence/public-*.json
            playwright-report/public/
          retention-days: 14
          if-no-files-found: error

  playwright-synthetic:
    name: Playwright synthetic provider
    if: >-
      github.event_name != 'pull_request' || github.event.action != 'synchronize' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI-only: Clerk keyless mode must never inject its claim overlay into tests.
      NEXT_PUBLIC_CLERK_KEYLESS_DISABLED: '1'
      # The tests' own server sees every request from one address: per-IP model limits are the spec's in production only.
      USAGE_LIMIT_PRE_SIGN_IN_REQUESTS_PER_IP_PER_HOUR: '100000'
      USAGE_LIMIT_PRE_SIGN_IN_REQUESTS_PER_IP_PER_DAY: '100000'
      USAGE_LIMIT_MODEL_REQUESTS_PER_IP_PER_HOUR: '100000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HARBOR_RELEASE_SHA }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build
      - name: Production synthetic provider
        env:
          HARBOR_E2E_WEB_SERVER_COMMAND: pnpm start
        run: pnpm exec playwright test --config=tests/e2e/playwright.synthetic.config.ts
      - name: Upload synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-synthetic-${{ env.HARBOR_RELEASE_SHA }}
          path: |
            test-results/synthetic/
            test-results/evidence/synthetic-*.json
            playwright-report/synthetic/
          retention-days: 14
          if-no-files-found: error

  playwright-preview:
    name: Playwright preview handshakes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: harbor-preview
    needs: [static-gates, migration-rls, playwright-public, playwright-synthetic]
    # Live staging jobs hold the harbor-preview secrets, so they run only for release/* pull requests from this
    # repository and for main. Other branches and forks skip them.
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release/')) ||
      (github.event_name == 'pull_request' &&
       startsWith(github.head_ref, 'release/') &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action != 'synchronize' || contains(github.event.pull_request.labels.*.name, 'full-ci')))
    outputs:
      preview_confirmed_sha: ${{ steps.preview-release.outputs.harbor_preview_confirmed_sha }}
    env:
      HARBOR_PREVIEW_BASE_URL: ${{ vars.HARBOR_PREVIEW_BASE_URL }}
      HARBOR_PREVIEW_EXPECTED_HOST: ${{ vars.HARBOR_PREVIEW_EXPECTED_HOST }}
      HARBOR_PRODUCTION_HOSTS: ${{ vars.HARBOR_PRODUCTION_HOSTS }}
      HARBOR_ENVIRONMENT_REVISION: ${{ vars.HARBOR_ENVIRONMENT_REVISION }}
      HARBOR_WORKER_VERSION: ${{ vars.HARBOR_WORKER_VERSION }}
      HARBOR_PREVIEW_RELEASE_STORAGE_STATE: tests/e2e/.auth/harbor-preview-release.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HARBOR_RELEASE_SHA }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Materialize preview release Clerk state
        env:
          USER_A: ${{ secrets.HARBOR_AUTH_STORAGE_STATE_USER_A_BASE64 }}
        run: |
          test -n "$USER_A"
          mkdir -p tests/e2e/.auth
          printf '%s' "$USER_A" | base64 --decode > "$HARBOR_PREVIEW_RELEASE_STORAGE_STATE"
      - name: Verify authenticated preview release SHA
        id: preview-release
        run: pnpm exec tsx scripts/verify-harbor-preview-release.ts
      - run: pnpm exec playwright test --config=tests/e2e/playwright.preview.config.ts
      - name: Upload preview evidence index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-preview-${{ env.HARBOR_RELEASE_SHA }}
          path: test-results/evidence/preview-*.json
          retention-days: 14
          if-no-files-found: warn
      # Traces, screenshots and the HTML report show signed-in staging pages, so they are only uploaded encrypted.
      - name: Encrypt preview traces and screenshots
        if: always()
        env:
          HARBOR_ARTIFACT_KEY: ${{ secrets.HARBOR_ARTIFACT_KEY }}
        run: |
          test -n "$HARBOR_ARTIFACT_KEY"
          dirs=$(ls -d test-results/preview playwright-report/preview 2>/dev/null || true)
          if [ -z "$dirs" ]; then exit 0; fi
          tar -czf preview-evidence.tar.gz $dirs
          openssl enc -aes-256-cbc -salt -pbkdf2 -in preview-evidence.tar.gz -out preview-evidence.tar.gz.enc -pass env:HARBOR_ARTIFACT_KEY
          rm preview-evidence.tar.gz
      - name: Upload encrypted preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-encrypted-${{ env.HARBOR_RELEASE_SHA }}
          path: preview-evidence.tar.gz.enc
          retention-days: 3
          if-no-files-found: ignore

  playwright-authenticated:
    name: Playwright authenticated and provider-delivered
    runs-on: ubuntu-latest
    # 60, not 45: on 24 Nov 2026 installing the browsers took 31 minutes and the job ran out of time mid-tests.
    timeout-minutes: 60
    environment: harbor-preview
    needs: [playwright-preview]
    # Live staging jobs hold the harbor-preview secrets, so they run only for release/* pull requests from this
    # repository and for main. Other branches and forks skip them.
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release/')) ||
      (github.event_name == 'pull_request' &&
       startsWith(github.head_ref, 'release/') &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action != 'synchronize' || contains(github.event.pull_request.labels.*.name, 'full-ci')))
    env:
      HARBOR_PREVIEW_BASE_URL: ${{ vars.HARBOR_PREVIEW_BASE_URL }}
      HARBOR_PREVIEW_EXPECTED_HOST: ${{ vars.HARBOR_PREVIEW_EXPECTED_HOST }}
      HARBOR_PRODUCTION_HOSTS: ${{ vars.HARBOR_PRODUCTION_HOSTS }}
      HARBOR_ENVIRONMENT_REVISION: ${{ vars.HARBOR_ENVIRONMENT_REVISION }}
      HARBOR_WORKER_VERSION: ${{ vars.HARBOR_WORKER_VERSION }}
      HARBOR_SUPABASE_EXPECTED_HOST: ${{ vars.HARBOR_SUPABASE_EXPECTED_HOST }}
      HARBOR_PRODUCTION_SUPABASE_HOSTS: ${{ vars.HARBOR_PRODUCTION_SUPABASE_HOSTS }}
      HARBOR_STATE_CASES_JSON: ${{ secrets.HARBOR_STATE_CASES_JSON }}
      HARBOR_RELEASE_FIXTURES_JSON: ${{ secrets.HARBOR_RELEASE_FIXTURES_JSON }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HARBOR_SMTP_TEST_RECIPIENT: ${{ secrets.HARBOR_SMTP_TEST_RECIPIENT }}
      # "off" when staging has no SMTP test inbox; delivery is then proved on prod-check (Elena, 10 Nov).
      HARBOR_STAGING_SMTP_HANDSHAKE: ${{ vars.HARBOR_STAGING_SMTP_HANDSHAKE }}
      HARBOR_PREVIEW_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      HARBOR_PREVIEW_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      HARBOR_PREVIEW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HARBOR_PREVIEW_DATABASE_URL: ${{ secrets.HARBOR_PREVIEW_DATABASE_URL }}
      HARBOR_PREVIEW_DB_CA: ${{ secrets.HARBOR_PREVIEW_DB_CA }}
      HARBOR_PREVIEW_STRIPE_WEBHOOK_SECRET: ${{ secrets.HARBOR_PREVIEW_STRIPE_WEBHOOK_SECRET }}
      HARBOR_PREVIEW_EMAIL_SINK: ${{ secrets.HARBOR_PREVIEW_EMAIL_SINK }}
      HARBOR_PREVIEW_CONFIRM_SUPABASE_REF: ${{ vars.HARBOR_PREVIEW_CONFIRM_SUPABASE_REF }}
      # Clerk Development key (sk_test_) for the fresh-account purchase test: creates and deletes one test user.
      HARBOR_CLERK_DEV_SECRET_KEY: ${{ secrets.HARBOR_CLERK_DEV_SECRET_KEY }}
      HARBOR_PREVIEW_EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HARBOR_PREVIEW_CONFIRMED_SHA: ${{ needs.playwright-preview.outputs.preview_confirmed_sha }}
      HARBOR_PREVIEW_CONFIRM_MUTATIONS: RUN_MUTATING_PREVIEW_HANDSHAKES
      HARBOR_PREVIEW_EVIDENCE_FILE: test-results/harbor-preview-handshake-evidence.jsonl
      HARBOR_ARTIFACT_KEY: ${{ secrets.HARBOR_ARTIFACT_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HARBOR_RELEASE_SHA }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Materialize ephemeral Clerk states
        env:
          USER_A: ${{ secrets.HARBOR_AUTH_STORAGE_STATE_USER_A_BASE64 }}
          USER_B: ${{ secrets.HARBOR_AUTH_STORAGE_STATE_USER_B_BASE64 }}
          DELETION_USER: ${{ secrets.HARBOR_AUTH_STORAGE_STATE_DELETION_USER_BASE64 }}
        run: |
          test -n "$USER_A" && test -n "$USER_B" && test -n "$DELETION_USER"
          mkdir -p tests/e2e/.auth
          printf '%s' "$USER_A" | base64 --decode > tests/e2e/.auth/harbor-user-a.json
          printf '%s' "$USER_B" | base64 --decode > tests/e2e/.auth/harbor-user-b.json
          printf '%s' "$DELETION_USER" | base64 --decode > tests/e2e/.auth/harbor-deletion-user.json
      - name: Check Clerk test sessions
        run: >-
          pnpm exec tsx scripts/check-harbor-auth-states.ts
          HARBOR_AUTH_STORAGE_STATE_USER_A_BASE64=tests/e2e/.auth/harbor-user-a.json
          HARBOR_AUTH_STORAGE_STATE_USER_B_BASE64=tests/e2e/.auth/harbor-user-b.json
          HARBOR_AUTH_STORAGE_STATE_DELETION_USER_BASE64=tests/e2e/.auth/harbor-deletion-user.json
      # Stage 1 or stage 2 expectations follow staging's own PAID_STAGES_ENABLED (sets HARBOR_PAID_STAGES_ENABLED).
      - name: Read whether staging takes payments
        env:
          HARBOR_PREVIEW_AUTH_STORAGE_STATE: tests/e2e/.auth/harbor-user-a.json
        run: pnpm exec tsx scripts/read-preview-paid-stages.ts
      - run: pnpm exec playwright test --config=tests/e2e/playwright.authenticated.config.ts
      - name: Playwright preview five-service handshakes
        env:
          HARBOR_PREVIEW_AUTH_STORAGE_STATE: tests/e2e/.auth/harbor-user-a.json
        run: pnpm test:e2e:preview-handshakes
      - name: Upload preview handshake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-handshakes-${{ env.HARBOR_RELEASE_SHA }}
          path: |
            test-results/harbor-preview-handshake-evidence.jsonl
            test-results/public/
            playwright-report/public/
          retention-days: 14
          if-no-files-found: error
      - name: Encrypt authenticated traces and screenshots
        if: always()
        run: |
          test -n "$HARBOR_ARTIFACT_KEY"
          # The handshake suite runs under the preview config, so its traces land in the preview folders.
          tar -czf authenticated-evidence.tar.gz $(ls -d test-results/authenticated playwright-report/authenticated test-results/preview playwright-report/preview 2>/dev/null)
          openssl enc -aes-256-cbc -salt -pbkdf2 -in authenticated-evidence.tar.gz -out authenticated-evidence.tar.gz.enc -pass env:HARBOR_ARTIFACT_KEY
          rm authenticated-evidence.tar.gz
      - name: Upload redacted evidence index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-index-${{ env.HARBOR_RELEASE_SHA }}
          path: test-results/evidence/authenticated-*.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload encrypted authenticated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-encrypted-${{ env.HARBOR_RELEASE_SHA }}
          path: authenticated-evidence.tar.gz.enc
          retention-days: 3
          if-no-files-found: error
